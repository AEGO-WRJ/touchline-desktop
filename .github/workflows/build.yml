name: Windows build and tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Run tests
        shell: powershell
        run: .\test.ps1
      - name: Build desktop app
        shell: powershell
        run: .\build.ps1
      - name: Upload executable
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Touchline-Windows
          path: dist/Touchline.exe
